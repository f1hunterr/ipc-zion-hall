services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: "4100"
      DB_PATH: /data/messages.db
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
      NODE_ENV: production
    volumes:
      - zion_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4100/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 15s

  web:
    build: .
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zion_data:
